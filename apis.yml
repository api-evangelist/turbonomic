aid: turbonomic
name: IBM Turbonomic
description: IBM Turbonomic is an Application Resource Management (ARM) platform that uses AI-powered automation
  to continuously analyze and optimize application performance and cloud costs across hybrid and multi-cloud environments.
  Turbonomic provides a comprehensive REST API enabling programmatic access to resource management data, workload
  actions, markets, policies, groups, templates, and topology information. The platform integrates with AWS, Azure,
  GCP, Kubernetes, VMware, and dozens of APM and ITSM tools.
